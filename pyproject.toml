[project]
name = "networkx-scheduler"
version = "0.1.0"
description = ""
authors = [
    {name = "icyveins7",email = "icyveins@hotmail.com"}
]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "networkx>=3.4,<4.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0,<9.0",
]

[tool.poetry]
packages = [{include = "networkx_scheduler", from = "src"}]

[tool.pytest.ini_options]
pythonpath = ["src"]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
